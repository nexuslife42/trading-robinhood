name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Check promotion direction
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$BASE" = main ] && [ "$HEAD_REPO" != "$REPOSITORY" ]; then
            echo 'Main releases must come from this repository staging branch.' >&2
            exit 1
          fi
          case "$BASE:$HEAD" in
            main:staging|staging:feat/*|staging:fix/*|staging:chore/*|staging:docs/*|staging:test/*|staging:dependabot/*) exit 0 ;;
            *) echo 'Use a topic branch into staging, then staging into main.' >&2; exit 1 ;;
          esac
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.14'
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest --cov=trading_robinhood --cov-report=term-missing
      - run: uv build --no-sources
  simulation:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.14'
      - run: uv sync --locked
      - run: uv run --no-sync pytest
      - name: Replay twice and compare
        run: |
          mkdir -p artifacts
          uv run --no-sync rh replay examples/synthetic-replay.json > artifacts/replay-one.json
          uv run --no-sync rh replay examples/synthetic-replay.json > artifacts/replay-two.json
          cmp artifacts/replay-one.json artifacts/replay-two.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-replay
          path: artifacts/replay-one.json
          retention-days: 14
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.14'
      - run: uv sync --locked
      - run: uv run --no-sync pip-audit --local --skip-editable
      - name: Download and verify Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full Git history
        run: '"${{ runner.temp }}/gitleaks" git --redact --no-banner --log-opts=--all .'
