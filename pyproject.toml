[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "trading-robinhood"
version = "0.1.0"
description = "Fail-closed personal trading development and simulation framework"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.11,<3",
  "mcp>=2.2,<3",
  "httpx2>=2.13,<3",
  "jsonschema>=4.23,<5",
  "keyring>=25.6,<26",
]

[project.scripts]
rh = "trading_robinhood.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "hypothesis>=6.130,<7",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-jsonschema>=4.23",
  "pip-audit>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trading_robinhood"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["connected: explicitly enabled broker integration checks"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# These test helpers run fixed Git/CLI argument arrays in temporary fixtures.
"tests/test_cli.py" = ["S603"]
"tests/test_release.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/trading_robinhood"]

[tool.coverage.run]
source = ["trading_robinhood"]
branch = true
